// YourMod — Hardmode (overall downscale; bigger spread by class)
// Class-based multipliers (Hardmode)
// Tight science economy with stronger dependence on size/class.

@PART[*]:HAS[@MODULE[AsteroidImpactSensor]]:NEEDS[YourMod]:AFTER[YourMod]
{
  @MODULE[AsteroidImpactSensor]
  {
    classMultA = 0.60
    classMultB = 0.80
    classMultC = 1.00
    classMultD = 1.20
    classMultE = 1.35

    // Keep experiment weights neutral; difficulty comes from class scaling
    //multSeis      = 0.95
    multEjecta    = 0.90
    //multVolatiles = 0.95
    multMagdust   = 0.95
    multAlbedo    = 0.90
    multRingdown  = 0.95
  }
}

