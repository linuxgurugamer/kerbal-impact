// YourMod — Carbonaceous focus (boost C/D for volatile science)
// Class-based multipliers (Carbonaceous Focus)
// Favors volatile-rich C/D classes and nudges volatile/photometry experiments.

@PART[*]:HAS[@MODULE[AsteroidImpactSensor]]:NEEDS[YourMod]:AFTER[YourMod]
{
  @MODULE[AsteroidImpactSensor]
  {
    classMultA = 0.85
    classMultB = 0.95
    classMultC = 1.25
    classMultD = 1.30
    classMultE = 1.10

    // Emphasize experiments that reveal buried/icy material
    multVolatiles = 1.25   // AST-VOLATILES
    multAlbedo    = 1.10   // AST-ALBEDO
    multSeis      = 1.00
    multEjecta    = 1.05
    multMagdust   = 0.95
    multRingdown  = 1.00
  }
}

