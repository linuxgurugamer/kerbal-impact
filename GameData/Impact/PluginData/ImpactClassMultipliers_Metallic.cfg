// YourMod — Metallic core hunt (boost D/E, EM & ring-down)
// Class-based multipliers (Metallic Focus)
// Rewards dense/metal-rich bodies; emphasizes EM & structural response.

@PART[*]:HAS[@MODULE[AsteroidImpactSensor]]:NEEDS[YourMod]:AFTER[YourMod]
{
  @MODULE[AsteroidImpactSensor]
  {
    classMultA = 0.90
    classMultB = 1.00
    classMultC = 1.08
    classMultD = 1.28
    classMultE = 1.40

    // Highlight magnetic flutter & ring-down on metallic rubble piles
    multMagdust  = 1.25   // AST-MAGDUST
    multRingdown = 1.15   // AST-RINGDOWN
    //multSeis     = 1.05
    multEjecta   = 0.95
    //multVolatiles= 0.90
    multAlbedo   = 0.95
  }
}

