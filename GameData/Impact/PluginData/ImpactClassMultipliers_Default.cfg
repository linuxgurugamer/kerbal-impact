// YourMod — Balanced defaults (gentle up-ramp by size)
// A little bonus as asteroids get bigger/denser.
// Place anywhere under GameData; requires ModuleManager.

@PART[*]:HAS[@MODULE[AsteroidImpactSensor]]:NEEDS[YourMod]:AFTER[YourMod]
{
  @MODULE[AsteroidImpactSensor]
  {
    // Global per-class multipliers (applied last, after experiment-specific math)
    classMultA = 0.90
    classMultB = 1.00
    classMultC = 1.12
    classMultD = 1.25
    classMultE = 1.35

    // Subtle experiment-wide scalars (optional; leave at 1 for neutral)
    //multSeis      = 1.00   // AST-SEIS
    multEjecta    = 1.00   // AST-EJECTA
    //multVolatiles = 1.00   // AST-VOLATILES
    multMagdust   = 1.00   // AST-MAGDUST
    multAlbedo    = 1.00   // AST-ALBEDO
    multRingdown  = 1.00   // AST-RINGDOWN
  }
}

